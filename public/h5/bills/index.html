<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bills</title>
<style>
  :root { --brand:#0057E4; --text:#12203A; --muted:#5B6B87; --border:#D7E0F0; --alt:#F2F6FF; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 -apple-system,system-ui,sans-serif; color:var(--text); padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .who { color:var(--muted); font-size:13px; margin-bottom:24px; }
  .biller { display:flex; align-items:center; justify-content:space-between;
            border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
  button { background:var(--brand); color:#fff; border:0; border-radius:999px;
           padding:10px 20px; font-weight:700; font-size:14px; }
  button:disabled { background:var(--border); }
  #out { margin-top:20px; padding:16px; border-radius:12px; background:var(--alt);
         font-size:14px; white-space:pre-wrap; min-height:24px; }
  .env { margin-top:24px; color:var(--muted); font-size:12px; }
</style>

<h1>Pay a bill</h1>
<div class="who" id="who">Loading…</div>

<div class="biller">
  <div><strong>Meralco</strong><br /><span class="who">Electricity</span></div>
  <button id="pay" disabled>Pay ₱50.00</button>
</div>

<div id="out"></div>
<div class="env" id="env"></div>

<script type="module">
  // The H5 owns the bridge object. Native only delivers JSON into it (ADR 3).
  const PROTOCOL_VERSION = 1
  const INTERACTIVE = new Set(['payments.requestPayment', 'ui.confirm'])
  const pending = new Map()
  let n = 0

  // Not a handshake: this only asks whether the channel object exists. A host
  // that never answers is caught by the per-call timeout instead.
  const hasChannel = !!window.ReactNativeWebView

  const bridge = {
    _receiveJSON(raw) { try { bridge._receive(JSON.parse(raw)) } catch {} },
    _receiveEventJSON(raw) { try { console.log('event', JSON.parse(raw)) } catch {} },
    _receive(res) {
      const entry = pending.get(res.id)
      if (!entry) return
      clearTimeout(entry.timer)
      pending.delete(res.id)
      res.ok ? entry.resolve(res.result) : entry.reject(res.error)
    },
  }
  window.__PITAKA_BRIDGE__ = bridge

  function call(method, params) {
    if (!hasChannel) return Promise.reject({ code: 'BRIDGE_UNAVAILABLE', message: 'no host' })
    const id = `h5-${++n}`
    const ms = INTERACTIVE.has(method) ? 120000 : 10000
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        pending.delete(id)
        reject({ code: 'TIMEOUT', message: `${method} timed out` })
      }, ms)
      pending.set(id, { resolve, reject, timer })
      window.ReactNativeWebView.postMessage(JSON.stringify({ id, v: PROTOCOL_VERSION, method, params }))
    })
  }

  const out = document.getElementById('out')
  const say = (t) => { out.textContent = t }

  ;(async () => {
    if (!hasChannel) {
      document.getElementById('who').textContent = 'Running outside the app'
      say('No host detected, so the bridge is unavailable. Open this from the Pitaka app.')
      return
    }
    const [profile, env] = await Promise.all([call('user.getProfile'), call('system.getEnvInfo')])
    document.getElementById('who').textContent = `${profile.displayName} · ${profile.maskedMobile}`
    document.getElementById('env').textContent =
      `${env.platform} · app ${env.appVersion} · bridge v${env.bridgeVersion}`
    document.getElementById('pay').disabled = false
  })().catch((e) => say(`Could not reach the host: ${e.code ?? e}`))

  // One key per intent, so a double tap is one payment.
  const idempotencyKey = `bill-${Date.now()}-${Math.round(Math.random() * 1e9)}`

  document.getElementById('pay').addEventListener('click', async (ev) => {
    ev.target.disabled = true
    say('Waiting for you to confirm in the app…')
    try {
      const r = await call('payments.requestPayment', {
        amountCentavos: 5000, billerId: 'meralco',
        reference: '123456789', idempotencyKey,
      })
      say(`Paid. Transaction ${r.transactionId}`)
    } catch (e) {
      // After a TIMEOUT the right move is retrying the same key, never a new one.
      say(e.code === 'TIMEOUT'
        ? 'Still checking your payment. Tap again to re-check, it will not charge twice.'
        : `Payment failed: ${e.code ?? e}`)
      ev.target.disabled = false
    }
  })
</script>
